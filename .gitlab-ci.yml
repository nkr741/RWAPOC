# GitLab CI — Claude merge-request review + quality gate.
#
# Runs only on merge-request pipelines. Two jobs:
#   review  — Claude reviews the diff and posts it as an MR note (never blocks)
#   gate    — Claude reviews the diff and FAILS the pipeline on any HIGH finding
#
# CI/CD variables (Settings → CI/CD → Variables, both masked):
#   ANTHROPIC_API_KEY  — Claude API key
#   GITLAB_API_TOKEN   — token with `api` scope, used only to post the MR note
#                        (CI_JOB_TOKEN cannot create notes)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages: [review]

image: node:22

variables:
  GIT_DEPTH: 0 # full history so `git diff target...HEAD` resolves
  CLAUDE_MODEL: claude-sonnet-5

.claude:
  before_script:
    - apt-get update -qq && apt-get install -y -qq jq > /dev/null
    - npm install -g @anthropic-ai/claude-code
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"

review:
  stage: review
  extends: .claude
  script:
    - bash scripts/ci/diff-review.sh "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" > review.md
    - cat review.md
    - |
      curl --fail --silent --show-error --request POST \
        --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        --data-urlencode "body@review.md" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" > /dev/null
  artifacts:
    when: always
    paths: [review.md]
    expire_in: 1 week
  allow_failure: true

gate:
  stage: review
  extends: .claude
  script:
    - bash scripts/ci/quality-gate.sh "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  artifacts:
    when: always
    paths: [quality-gate.json]
    expire_in: 1 week
