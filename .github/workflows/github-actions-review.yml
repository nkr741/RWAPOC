name: Claude PR Review

# Interactive review: mention @claude in a PR comment, review comment, review body, or issue
# and Claude answers in-thread — it can read the diff, run the checks, and push fixes to the
# PR branch when asked. Nothing runs unless the trigger phrase is present.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Trigger phrase AND the author must be a repo owner/member/collaborator — this job has
    # write permissions, so a drive-by comment on a public repo must not be able to start it.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                    github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write # let Claude push fixes to the PR branch when asked
      pull-requests: write
      issues: write
      id-token: write
      actions: read # read CI results of the PR being reviewed
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so `git diff origin/main...HEAD` works

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: '@claude'
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(npm run check),Bash(npx tsc --noEmit),Bash(npx eslint .),Bash(npx playwright test --project=api)"
