name: E2E Tests

on:
  pull_request:
  schedule:
    - cron: '0 2 * * *' # nightly 02:00 UTC
  workflow_dispatch: # manual re-run button

env:
  BASE_URL: http://localhost:3000
  API_URL: http://localhost:3001

jobs:
  # ── PR GATE ──────────────────────────────────────────────────────────────
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Claude failure analysis posts a PR comment
    steps:
      - uses: actions/checkout@v5

      # ── Build & start the RWA app ──
      - name: Clone Cypress Real World App
        run: git clone --depth 1 https://github.com/cypress-io/cypress-realworld-app.git rwa-app-ci

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install RWA dependencies
        working-directory: rwa-app-ci
        run: yarn install --frozen-lockfile

      - name: Build RWA frontend
        working-directory: rwa-app-ci
        run: yarn build

      # db:seed regenerates the dataset with ts-node + faker on every shard.
      # It is slow and it fails intermittently (shard 2 of run #38). RWA already
      # ships data/database-seed.json, and db:seed:dev just copies it — so the
      # data is identical across shards and there is nothing left to flake.
      - name: Seed RWA database
        working-directory: rwa-app-ci
        run: yarn db:seed:dev

      - name: Set test credentials from seeded data
        working-directory: rwa-app-ci
        run: |
          SEEDED_USER=$(node -e "console.log(require('./data/database.json').users[0].username)")
          echo "QA_USER=$SEEDED_USER" >> $GITHUB_ENV
          echo "QA_PASSWORD=s3cret" >> $GITHUB_ENV
          echo "RWA_DB_PATH=$(pwd)/data/database.json" >> $GITHUB_ENV
          echo "Using seeded user: $SEEDED_USER"

      - name: Start RWA app in background
        working-directory: rwa-app-ci
        run: yarn start:ci > ../rwa-app.log 2>&1 &

      - name: Wait for RWA app to be ready
        run: npx wait-on http-get://localhost:3000 --timeout 120000

      - name: Show RWA logs on failure
        if: failure()
        run: cat rwa-app.log || true

      # ── Run the test framework ──
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Type gate
        run: npx tsc --noEmit
      - name: Lint gate
        run: npx eslint .

      - name: API + integration tests
        run: npx playwright test --project=api

      - name: UI smoke tests
        run: npx playwright test --grep @smoke --project=setup --project=chromium

      # ── Claude root-cause analysis (only when something failed) ──
      - name: Install Claude Code CLI
        if: failure()
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyse failures with Claude
        if: failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/ci/test-failure-analysis.sh

      - name: Post analysis on the PR
        if: failure() && hashFiles('test-failure-analysis.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file test-failure-analysis.md

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            test-results/

  # ── NIGHTLY REGRESSION ───────────────────────────────────────────────────
  regression:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      # ── Build & start the RWA app ──
      - name: Clone Cypress Real World App
        run: git clone --depth 1 https://github.com/cypress-io/cypress-realworld-app.git rwa-app-ci

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install RWA dependencies
        working-directory: rwa-app-ci
        run: yarn install --frozen-lockfile

      - name: Build RWA frontend
        working-directory: rwa-app-ci
        run: yarn build

      # db:seed regenerates the dataset with ts-node + faker on every shard.
      # It is slow and it fails intermittently (shard 2 of run #38). RWA already
      # ships data/database-seed.json, and db:seed:dev just copies it — so the
      # data is identical across shards and there is nothing left to flake.
      - name: Seed RWA database
        working-directory: rwa-app-ci
        run: yarn db:seed:dev

      - name: Set test credentials from seeded data
        working-directory: rwa-app-ci
        run: |
          SEEDED_USER=$(node -e "console.log(require('./data/database.json').users[0].username)")
          echo "QA_USER=$SEEDED_USER" >> $GITHUB_ENV
          echo "QA_PASSWORD=s3cret" >> $GITHUB_ENV
          echo "RWA_DB_PATH=$(pwd)/data/database.json" >> $GITHUB_ENV
          echo "Using seeded user: $SEEDED_USER"

      - name: Start RWA app in background
        working-directory: rwa-app-ci
        run: yarn start:ci > ../rwa-app.log 2>&1 &

      - name: Wait for RWA app to be ready
        run: npx wait-on http-get://localhost:3000 --timeout 120000

      - name: Show RWA logs on failure
        if: failure()
        run: cat rwa-app.log || true

      # ── Run the test framework ──
      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Run tests (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          # Empty on a fully-passing shard: --reporter=blob replaces the json/junit
          # reporters, so nothing lands here unless a test actually failed.
          if-no-files-found: ignore

  # ── MERGE REPORTS (nightly only) ─────────────────────────────────────────
  merge-reports:
    if: github.event_name != 'pull_request' && !cancelled()
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-shard-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter=html all-blob-reports

      - uses: actions/upload-artifact@v5
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 30

      # ── Claude root-cause analysis across all shards (only when something failed) ──
      - name: Merge into JSON for analysis
        if: needs.regression.result != 'success'
        run: |
          mkdir -p test-results
          npx playwright merge-reports --reporter=json all-blob-reports > test-results/results.json

      - name: Install Claude Code CLI
        if: needs.regression.result != 'success'
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyse failures with Claude
        if: needs.regression.result != 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/ci/test-failure-analysis.sh

      - uses: actions/upload-artifact@v5
        if: needs.regression.result != 'success'
        with:
          name: test-failure-analysis
          path: test-failure-analysis.md
          if-no-files-found: ignore

  # ── NOTIFICATIONS ────────────────────────────────────────────────────────
  notify:
    if: github.event_name != 'pull_request' && !cancelled()
    needs: [regression, merge-reports]
    runs-on: ubuntu-latest
    # Declared at job level on purpose: a step's own `env:` is not visible to
    # that same step's `if:`, so the guards below silently skipped and the job
    # went green without ever sending anything.
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    steps:
      - name: Determine result
        id: result
        run: |
          if [ "${{ needs.regression.result }}" = "success" ]; then
            echo "status=PASSED ✅" >> $GITHUB_OUTPUT
            echo "color=28a745" >> $GITHUB_OUTPUT
          else
            echo "status=FAILED ❌" >> $GITHUB_OUTPUT
            echo "color=dc3545" >> $GITHUB_OUTPUT
          fi
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "E2E Nightly: ${{ steps.result.outputs.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*E2E Nightly Run: ${{ steps.result.outputs.status }}*\nBranch: `${{ github.ref_name }}`\n<${{ steps.result.outputs.run_url }}|View Run>"
                  }
                }
              ]
            }'

      - name: Notify Teams
        if: env.TEAMS_WEBHOOK_URL != ''
        run: |
          curl -X POST "$TEAMS_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "type": "AdaptiveCard",
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "version": "1.4",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": "E2E Nightly: ${{ steps.result.outputs.status }}",
                        "weight": "Bolder",
                        "size": "Medium"
                      },
                      {
                        "type": "TextBlock",
                        "text": "Branch: ${{ github.ref_name }}",
                        "spacing": "None"
                      }
                    ],
                    "actions": [
                      {
                        "type": "Action.OpenUrl",
                        "title": "View Run",
                        "url": "${{ steps.result.outputs.run_url }}"
                      }
                    ]
                  }
                }
              ]
            }'
